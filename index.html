<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KELL MOTOS PRO | Enterprise ERP</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="Logo.jpg" alt="Logo" class="logo-img">
            <span class="logo-text">KELL MOTOS</span>
        </div>
        
        <div class="nav-links">
            <div class="nav-item active" onclick="showTab('m-dash')" id="tab-m-dash">
                <i class="ri-dashboard-3-line"></i> <span>Dashboard</span>
            </div>
            <div class="nav-item" onclick="showTab('m-estoque')" id="tab-m-estoque">
                <i class="ri-archive-line"></i> <span>Estoque</span>
            </div>
            <div class="nav-item" onclick="showTab('m-vendas')" id="tab-m-vendas">
                <i class="ri-shopping-cart-2-line"></i> <span>Vendas</span>
            </div>
            <div class="nav-item" onclick="showTab('m-financeiro')" id="tab-m-financeiro">
                <i class="ri-bank-card-line"></i> <span>Financeiro</span>
            </div>
            <div class="nav-item" onclick="showTab('m-admin')" id="tab-m-admin">
                <i class="ri-settings-5-line"></i> <span>Configurações</span>
            </div>
        </div>

        <div class="user-profile" id="user-info-box">
            <div class="user-avatar" id="user-initials">?</div>
            <div class="user-details">
                <p class="user-name" id="user-display-name">Carregando...</p>
                <p class="user-role" id="user-display-role">Nível</p>
            </div>
            <button class="btn-logout" onclick="auth.signOut()"><i class="ri-logout-box-r-line"></i></button>
        </div>
    </nav>

    <main class="main-content">
        <!-- MODULO: ESTOQUE -->
        <section id="m-estoque" class="menu-section" style="display:none">
            <div class="section-header">
                <h2>Gerenciamento de Estoque</h2>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="toggleFormCadastro()"><i class="ri-add-line"></i> Novo Produto</button>
                </div>
            </div>

            <!-- Formulário de Cadastro/Edição -->
            <div class="card hidden" id="form-cadastro">
                <div class="card-header-flex">
                    <h3>Dados do Produto</h3>
                    <button class="btn-close" onclick="toggleFormCadastro()"><i class="ri-close-line"></i></button>
                </div>
                <input type="hidden" id="edit-id">
                
                <div class="form-grid-premium">
                    <div class="form-group">
                        <label>Modelo / Nome do Produto*</label>
                        <input id="modelo" class="input-style" placeholder="Ex: Pneu Traseiro Biz 125">
                    </div>
                    <div class="form-group">
                        <label>Código SKU</label>
                        <input id="codigo" class="input-style" placeholder="Ex: PN-001">
                    </div>
                    <div class="form-group">
                        <label>URL da Imagem</label>
                        <input id="img_url" class="input-style" placeholder="https://imagem.com/foto.jpg">
                    </div>
                    <div class="form-group">
                        <label>Quantidade Atual*</label>
                        <input id="qtd" type="number" class="input-style" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>Custo Unitário (R$)</label>
                        <input id="compra" type="number" class="input-style" placeholder="0.00" oninput="calcularSugerido()">
                    </div>
                    <div class="form-group">
                        <label>Taxa de Envio (R$)</label>
                        <input id="taxa_envio" type="number" class="input-style" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Preço de Venda (R$)*</label>
                        <input id="repasse" type="number" class="input-style" placeholder="0.00">
                    </div>
                </div>
                
                <label style="margin-top:15px; display:block; font-weight:600;">Compatibilidade de Motos:</label>
                <div id="moto-selector-list" class="moto-selector-grid"></div>
                
                <div class="form-footer">
                    <button class="btn btn-secondary" onclick="toggleFormCadastro()">Cancelar</button>
                    <button class="btn btn-primary" onclick="salvarProduto()"><i class="ri-save-line"></i> Salvar Alterações</button>
                </div>
            </div>

            <!-- Filtros e Busca -->
            <div class="card filter-bar">
                <i class="ri-search-line"></i>
                <input type="text" id="busca" placeholder="Buscar por modelo, código ou moto..." oninput="renderizarEstoque()">
            </div>

            <div class="card table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Compatibilidade</th>
                            <th>Status / Qtd</th>
                            <th>Venda</th>
                            <th style="text-align:right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-estoque"></tbody>
                </table>
            </div>
        </section>

        <!-- Outras Seções (m-dash, m-vendas, etc) seguem a mesma lógica... -->
        <!-- Otimizando para brevidade, as seções serão controladas via JS -->
    </main>

    <script src="core.js"></script>
    <script src="estoque.js"></script>
    <script src="vendas.js"></script>
    <script src="financeiro.js"></script>
    <script src="admin.js"></script>
</body>
</html>
